spring.application.name=veterinaria-citas-backend
server.port=${SERVER_PORT:8084}

# MySQL de XAMPP: usuario root sin contraseña. La base se crea sola al iniciar.
spring.datasource.url=${CITAS_DB_URL:jdbc:mysql://localhost:3306/veterinaria_citas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${CITAS_DB_USER:root}
spring.datasource.password=${CITAS_DB_PASSWORD:}

# Hibernate crea y actualiza las tablas a partir de las entidades (paquete model).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: el mismo secreto en los tres servicios (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-secreto-jwt-2026-cambiar-en-produccion!}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}

# Origenes permitidos por CORS (frontend de Vite)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI: http://localhost:8084/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# citas consulta al catalogo reenviando el token del usuario
app.catalogo.url=${CATALOGO_URL:http://localhost:8083}
# Reglas de agenda
app.citas.capacidad-por-bloque=${CITAS_CAPACIDAD_POR_BLOQUE:3}
