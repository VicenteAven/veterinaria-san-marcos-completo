spring.application.name=auth
server.port=${SERVER_PORT:8082}

# MySQL de XAMPP: usuario root sin contraseña. La base se crea sola al iniciar.
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/veterinaria_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}

# Hibernate crea y actualiza las tablas a partir de las entidades (paquete model).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: el mismo secreto en los tres servicios (minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-secreto-jwt-2026-cambiar-en-produccion!}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}

# Origenes permitidos por CORS (frontend de Vite)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Swagger UI: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Contrasenas de los usuarios de demostracion (solo se crean si la tabla usuario esta vacia)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin#2026}
app.seed.recepcion-password=${SEED_RECEPCION_PASSWORD:Recepcion#2026}
app.seed.dueno-password=${SEED_DUENO_PASSWORD:Dueno#2026}
